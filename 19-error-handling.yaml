- name: user creation
  hosts: local
  connection: local
  become: yes
  tasks:
  - name: check user exists or not
    ansible.builtin.command: id roboshop
    register: user_output
    ignore_errors: true

  - name: print user_output
    ansible.builtin.debug:
      msg: "{{ user_output }}"

  - name: creta user
    ansible.builtin.command: useradd roboshop
    when: user_output.rc != 0